<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You 💗</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&family=Fredoka:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Floating background doodles and hearts -->
    <div class="background-container">
        <div class="doodle-bg"></div>
        <div class="falling-hearts"></div>
    </div>

    <!-- Cursor sparkles -->
    <div class="sparkles-container"></div>

    <!-- Main content container -->
    <div class="container">
        <!-- Screen 1: Welcome -->
        <div class="screen screen-1 active">
            <div class="cute-card">
                <div class="dog-icon dog-happy">
                    <svg viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg">
                        <!-- Body lying down -->
                        <ellipse cx="60" cy="85" rx="35" ry="28" fill="#FFF" stroke="#333" stroke-width="2.5"/>
                        <!-- Head -->
                        <circle cx="45" cy="45" r="28" fill="#FFF" stroke="#333" stroke-width="2.5"/>
                        <!-- Top black spot -->
                        <path d="M 25 25 Q 35 10 45 12 Q 55 10 65 25 Q 65 35 45 40 Q 25 35 25 25" fill="#333"/>
                        <!-- Left ear droopy -->
                        <ellipse cx="18" cy="28" rx="8" ry="22" fill="#333"/>
                        <!-- Right ear droopy -->
                        <ellipse cx="72" cy="28" rx="8" ry="22" fill="#333"/>
                        <!-- Snout -->
                        <ellipse cx="45" cy="55" rx="10" ry="8" fill="#FFF" stroke="#333" stroke-width="2"/>
                        <!-- Nose -->
                        <circle cx="45" cy="52" r="3.5" fill="#333"/>
                        <!-- Eyes -->
                        <circle cx="35" cy="42" r="3" fill="#333"/>
                        <circle cx="55" cy="42" r="3" fill="#333"/>
                        <circle cx="36" cy="41" r="1.2" fill="#fff"/>
                        <circle cx="56" cy="41" r="1.2" fill="#fff"/>
                        <!-- Happy mouth -->
                        <path d="M 42 58 Q 45 62 48 58" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
                        <!-- Cheeks -->
                        <circle cx="25" cy="48" r="4" fill="#FFB3D9" opacity="0.5"/>
                        <circle cx="65" cy="48" r="4" fill="#FFB3D9" opacity="0.5"/>
                        <!-- Paws -->
                        <ellipse cx="75" cy="110" rx="6" ry="10" fill="#FFF" stroke="#333" stroke-width="2"/>
                        <ellipse cx="28" cy="110" rx="6" ry="10" fill="#FFF" stroke="#333" stroke-width="2"/>
                    </svg>
                </div>
                <h1 class="greeting">Hiiiii bb shenshen 💗</h1>
                <p class="subtitle">I made something for you >.<</p>
                <button class="btn btn-primary" data-action="next-screen">okay??</button>
                <div class="bouncing-hearts">
                    <span class="heart">💗</span>
                    <span class="heart">💖</span>
                    <span class="heart">💕</span>
                </div>
            </div>
        </div>

        <!-- Screen 2: Confirmation -->
        <div class="screen screen-2">
            <div class="cute-card">
                <div class="dog-icon dog-cute">
                    <svg viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg">
                        <!-- Body -->
                        <ellipse cx="60" cy="90" rx="32" ry="32" fill="#FFF" stroke="#333" stroke-width="2.5"/>
                        <!-- Head -->
                        <circle cx="60" cy="45" r="30" fill="#FFF" stroke="#333" stroke-width="2.5"/>
                        <!-- Top black spot -->
                        <path d="M 35 22 Q 45 8 60 10 Q 75 8 85 22 Q 85 32 60 38 Q 35 32 35 22" fill="#333"/>
                        <!-- Left ear floppy cute -->
                        <ellipse cx="28" cy="26" rx="8" ry="24" fill="#333"/>
                        <!-- Right ear floppy cute -->
                        <ellipse cx="92" cy="26" rx="8" ry="24" fill="#333"/>
                        <!-- Snout -->
                        <ellipse cx="60" cy="58" rx="11" ry="9" fill="#FFF" stroke="#333" stroke-width="2"/>
                        <!-- Nose -->
                        <circle cx="60" cy="54" r="4" fill="#333"/>
                        <!-- Big eyes cute -->
                        <circle cx="48" cy="40" r="4.5" fill="#333"/>
                        <circle cx="72" cy="40" r="4.5" fill="#333"/>
                        <circle cx="50" cy="38" r="1.5" fill="#fff"/>
                        <circle cx="74" cy="38" r="1.5" fill="#fff"/>
                        <!-- Excited mouth -->
                        <path d="M 58 62 Q 60 66 62 62" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
                        <!-- Tiny tongue -->
                        <ellipse cx="60" cy="66" rx="2" ry="1.5" fill="#FFB3D9"/>
                        <!-- Big rosy cheeks -->
                        <circle cx="28" cy="50" r="5" fill="#FFB3D9" opacity="0.6"/>
                        <circle cx="92" cy="50" r="5" fill="#FFB3D9" opacity="0.6"/>
                        <!-- Paws -->
                        <ellipse cx="42" cy="120" rx="6" ry="11" fill="#FFF" stroke="#333" stroke-width="2"/>
                        <ellipse cx="78" cy="120" rx="6" ry="11" fill="#FFF" stroke="#333" stroke-width="2"/>
                    </svg>
                </div>
                <h2>Do you want to open it? (｡•̀ᴗ-)✧</h2>
                <div class="button-group">
                    <button class="btn btn-primary" data-action="open-letter">Open it 💌</button>
                    <button class="btn btn-secondary" id="nope-button">No. ty</button>
                </div>
                <div class="bouncing-hearts">
                    <span class="heart">💗</span>
                    <span class="heart">💖</span>
                </div>
            </div>
        </div>

        <!-- Screen 3: Sad dog (when clicking No) -->
        <div class="screen screen-3 hidden">
            <div class="cute-card">
                <div class="dog-icon dog-sad">
                    <svg viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg">
                        <!-- Body -->
                        <ellipse cx="60" cy="90" rx="32" ry="32" fill="#FFF" stroke="#333" stroke-width="2.5"/>
                        <!-- Head -->
                        <circle cx="60" cy="45" r="30" fill="#FFF" stroke="#333" stroke-width="2.5"/>
                        <!-- Top black spot -->
                        <path d="M 35 22 Q 45 8 60 10 Q 75 8 85 22 Q 85 32 60 38 Q 35 32 35 22" fill="#333"/>
                        <!-- Left ear sad droopy -->
                        <ellipse cx="28" cy="32" rx="8" ry="26" fill="#333" transform="rotate(-12 28 32)"/>
                        <!-- Right ear sad droopy -->
                        <ellipse cx="92" cy="32" rx="8" ry="26" fill="#333" transform="rotate(12 92 32)"/>
                        <!-- Sad eyes -->
                        <circle cx="48" cy="40" r="4" fill="#333"/>
                        <circle cx="72" cy="40" r="4" fill="#333"/>
                        <circle cx="50" cy="39" r="1.2" fill="#fff"/>
                        <circle cx="74" cy="39" r="1.2" fill="#fff"/>
                        <!-- Sad eyebrows angled down -->
                        <path d="M 43 34 Q 48 32 53 35" stroke="#333" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                        <path d="M 67 35 Q 72 32 77 34" stroke="#333" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                        <!-- Tears -->
                        <circle cx="48" cy="50" r="2" fill="#87CEEB"/>
                        <circle cx="72" cy="50" r="2" fill="#87CEEB"/>
                        <!-- Tear streaks -->
                        <path d="M 48 52 L 48 57" stroke="#87CEEB" stroke-width="1" opacity="0.6"/>
                        <path d="M 72 52 L 72 57" stroke="#87CEEB" stroke-width="1" opacity="0.6"/>
                        <!-- Snout -->
                        <ellipse cx="60" cy="58" rx="11" ry="9" fill="#FFF" stroke="#333" stroke-width="2"/>
                        <!-- Nose -->
                        <circle cx="60" cy="54" r="4" fill="#333"/>
                        <!-- Sad mouth upside down -->
                        <path d="M 58 64 Q 60 61 62 64" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
                        <!-- Sad cheeks -->
                        <circle cx="28" cy="50" r="5" fill="#FFB3D9" opacity="0.4"/>
                        <circle cx="92" cy="50" r="5" fill="#FFB3D9" opacity="0.4"/>
                        <!-- Paws -->
                        <ellipse cx="42" cy="120" rx="6" ry="11" fill="#FFF" stroke="#333" stroke-width="2"/>
                        <ellipse cx="78" cy="120" rx="6" ry="11" fill="#FFF" stroke="#333" stroke-width="2"/>
                    </svg>
                </div>
                <h2>Awh... Let's try again bb 🥺</h2>
                <p class="subtitle">Please? >.<</p>
                <button class="btn btn-primary" data-action="retry">Okay, let's try again</button>
            </div>
        </div>

        <!-- Screen 4: Love Letter -->
        <div class="screen screen-4">
            <div class="letter-container">
                <!-- Letter card -->
                <div class="letter-card">
                    <div class="letter-header">
                        <h2 class="letter-title">For You 💗</h2>
                    </div>
                    
                    <!-- Photo section -->
                    <div class="photo-section">
                        <img src="assets/photo.jpg" alt="Our moment" class="letter-photo" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22300%22><rect fill=%22%23FFE4F0%22 width=%22300%22 height=%22300%22/><text x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 font-family=%22Arial%22 font-size=%2224%22 fill=%22%23FF69B4%22>📸 Add your photo here!</text></svg>'">
                    </div>

                    <!-- Typing message -->
                    <div class="letter-content">
                        <div class="typing-text" id="typing-text"></div>
                    </div>

                    <div class="letter-actions">
                        <!-- Next button -->
                        <button class="btn btn-primary letter-next-btn" data-action="to-final">One more thing... 💗</button>

                        <!-- Music toggle -->
                        <button class="music-toggle" id="music-toggle" aria-label="Toggle music" title="Toggle music">
                            <span class="music-icon">🎵</span>
                        </button>
                    </div>
                    <audio id="background-music" loop autoplay>
                        <source src="assets/music.mp3" type="audio/mpeg">
                    </audio>
                </div>

                <!-- Decorative floating hearts -->
                <div class="letter-hearts">
                    <span class="float-heart">💗</span>
                    <span class="float-heart">💖</span>
                    <span class="float-heart">💕</span>
                    <span class="float-heart">💗</span>
                </div>
            </div>
        </div>

        <!-- Screen 5: Final Question -->
        <div class="screen screen-5">
            <div class="cute-card">
                <div class="dog-icon dog-hopeful">
                    <svg viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg">
                        <!-- Body -->
                        <ellipse cx="60" cy="90" rx="32" ry="32" fill="#FFF" stroke="#333" stroke-width="2.5"/>
                        <!-- Head -->
                        <circle cx="60" cy="45" r="30" fill="#FFF" stroke="#333" stroke-width="2.5"/>
                        <!-- Top black spot -->
                        <path d="M 35 22 Q 45 8 60 10 Q 75 8 85 22 Q 85 32 60 38 Q 35 32 35 22" fill="#333"/>
                        <!-- Left ear hopeful attentive -->
                        <ellipse cx="28" cy="24" rx="8" ry="23" fill="#333" transform="rotate(-8 28 24)"/>
                        <!-- Right ear hopeful attentive -->
                        <ellipse cx="92" cy="24" rx="8" ry="23" fill="#333" transform="rotate(8 92 24)"/>
                        <!-- Hopeful eyes big shiny -->
                        <circle cx="48" cy="40" r="5" fill="#333"/>
                        <circle cx="72" cy="40" r="5" fill="#333"/>
                        <circle cx="50" cy="37" r="2" fill="#fff"/>
                        <circle cx="74" cy="37" r="2" fill="#fff"/>
                        <!-- Hopeful eyebrows raised -->
                        <path d="M 43 32 Q 48 29 53 32" stroke="#333" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                        <path d="M 67 32 Q 72 29 77 32" stroke="#333" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                        <!-- Snout -->
                        <ellipse cx="60" cy="58" rx="11" ry="9" fill="#FFF" stroke="#333" stroke-width="2"/>
                        <!-- Nose -->
                        <circle cx="60" cy="54" r="4" fill="#333"/>
                        <!-- Hopeful smile gentle -->
                        <path d="M 58 62 Q 60 65 62 62" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
                        <!-- Hopeful cheeks -->
                        <circle cx="28" cy="50" r="5" fill="#FFB3D9" opacity="0.7"/>
                        <circle cx="92" cy="50" r="5" fill="#FFB3D9" opacity="0.7"/>
                        <!-- Paws -->
                        <ellipse cx="42" cy="120" rx="6" ry="11" fill="#FFF" stroke="#333" stroke-width="2"/>
                        <ellipse cx="78" cy="120" rx="6" ry="11" fill="#FFF" stroke="#333" stroke-width="2"/>
                    </svg>
                </div>
                <h2 id="final-question-text">Will you forgive me? 🥺</h2>
                <p class="subtitle final-reaction-text" id="final-reaction-text">Please? >.&lt;</p>
                <div class="button-group final-buttons">
                    <button class="btn btn-yes" data-action="yes">Yes bb 💖</button>
                    <button class="btn btn-no" id="no-button">No 😭</button>
                </div>
                <div class="bouncing-hearts">
                    <span class="heart">💗</span>
                    <span class="heart">💖</span>
                    <span class="heart">💕</span>
                </div>
            </div>
        </div>

        <!-- Success Screen -->
        <div class="screen screen-success hidden">
            <div class="celebration-container">
                <div class="dog-icon dog-happy large-dog">
                    <svg viewBox="0 0 140 160" xmlns="http://www.w3.org/2000/svg">
                        <!-- Body jumping joy -->
                        <ellipse cx="70" cy="100" rx="40" ry="35" fill="#FFF" stroke="#333" stroke-width="3"/>
                        <!-- Head -->
                        <circle cx="70" cy="45" r="35" fill="#FFF" stroke="#333" stroke-width="3"/>
                        <!-- Top black spot big happy -->
                        <path d="M 40 18 Q 50 0 70 3 Q 90 0 100 18 Q 100 30 70 38 Q 40 30 40 18" fill="#333"/>
                        <!-- Left ear flopping with joy -->
                        <ellipse cx="25" cy="28" rx="10" ry="26" fill="#333" transform="rotate(-15 25 28)"/>
                        <!-- Right ear flopping with joy -->
                        <ellipse cx="115" cy="28" rx="10" ry="26" fill="#333" transform="rotate(15 115 28)"/>
                        <!-- Snout -->
                        <ellipse cx="70" cy="62" rx="13" ry="11" fill="#FFF" stroke="#333" stroke-width="2.5"/>
                        <!-- Nose -->
                        <circle cx="70" cy="57" r="5" fill="#333"/>
                        <!-- Eyes HUGE joyful -->
                        <circle cx="54" cy="42" r="5.5" fill="#333"/>
                        <circle cx="86" cy="42" r="5.5" fill="#333"/>
                        <circle cx="56" cy="39" r="2" fill="#fff"/>
                        <circle cx="88" cy="39" r="2" fill="#fff"/>
                        <!-- HUGE joyful smile -->
                        <path d="M 65 68 Q 70 75 75 68" stroke="#333" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                        <!-- Big happy eye crinkles extreme joy -->
                        <path d="M 45 32 Q 54 28 60 32" stroke="#333" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.8"/>
                        <path d="M 80 32 Q 86 28 95 32" stroke="#333" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.8"/>
                        <!-- BIG happy cheeks -->
                        <circle cx="28" cy="52" r="6.5" fill="#FFB3D9" opacity="0.7"/>
                        <circle cx="112" cy="52" r="6.5" fill="#FFB3D9" opacity="0.7"/>
                        <!-- Front paws kicking in joy -->
                        <ellipse cx="48" cy="130" rx="7" ry="13" fill="#FFF" stroke="#333" stroke-width="2.5"/>
                        <ellipse cx="92" cy="130" rx="7" ry="13" fill="#FFF" stroke="#333" stroke-width="2.5"/>
                    </svg>
                </div>
                <h1 class="success-text">YAYYYY I LOVE YOU SO MUCHHH 💕</h1>
                <div class="confetti" id="confetti"></div>
                <button class="btn btn-primary" data-action="restart">From the top kay bangin kikilig kapa hehe 💗</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
